# Configuração de build do Netlify — publicação automática a cada push.
# O sistema usa rotas por hash (#/rota), então não precisa de redirects de SPA.
# Os testes rodam antes do build: se algum quebrar (ex.: uma regressão na
# mesclagem/sincronização), o deploy é barrado.
[build]
  command = "npm test && npm run build"
  publish = "dist"
